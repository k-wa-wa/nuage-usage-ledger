# cicerone3270 (3270 端末の案内) に足す、使用量勘定の辞書。
# nuage-cluster が mainframe ホストの cicerone3270 に読ませる (パッケージの cicerone3270/ に入る)。
# 手元で試す: ci3270 --guide guide 127.0.0.1:3270 (Ctrl+L で読み直せる)
# 書式は cicerone3270 の README の「辞書」を参照。

# ---------------------------------------------------------------- 画面に足す「できること」と説明

[[screen]]
id = "ledger-dslist-entry"
extends = "dslist-entry"

[[screen.action]]
label = "使用量勘定 (NUAGE.USAGE) を一覧"
keys = "{home}{tab}{eraseeof}NUAGE.USAGE{enter}"

[[screen]]
id = "ledger-dslist"
extends = "dslist"
description = "使用量勘定の勘定マスタは NUAGE.USAGE.MASTER の一番新しい世代が最新の残高である。"

[[screen.region]]
rows = [3, 22]
cols = [69, 74]
title = "使用量勘定のレコード長"
note = "勘定マスタは 100、仕訳・総勘定元帳・業務日付は 80。照会用の勘定マスタは 100、照会用の仕訳は 104 (VSAM)。"

[[screen]]
id = "ledger-tso-welcome"
extends = "tso-welcome"

[[screen.action]]
label = "使用量勘定のデータセットを一覧 (LISTCAT)"
keys = "LISTCAT LEVEL(NUAGE){enter}"

[[screen.action]]
label = "使用量勘定のオンライン照会を開始 (KICKS)"
keys = "EXEC 'NUAGE.USAGE.CLIST(LEDGER)'{enter}"

[[screen]]
id = "ledger-tso-ready"
extends = "tso-ready"

[[screen.action]]
label = "使用量勘定のデータセットを一覧 (LISTCAT)"
keys = "LISTCAT LEVEL(NUAGE){enter}"

[[screen.action]]
label = "使用量勘定のオンライン照会を開始 (KICKS)"
keys = "EXEC 'NUAGE.USAGE.CLIST(LEDGER)'{enter}"

# ---------------------------------------------------------------- オンライン (KICKS)
# 画面は mvs/online/LLSTSET.bms と LBALSET.bms、プログラムは LLSTPGM.cbl と LBALPGM.cbl。
# 画面を変えたら、ここの桁も合わせて変える。

[[screen]]
id = "ledger-llst"
title = "勘定一覧 (KICKS のトランザクション LLST)"
match = ['\A\s*LLST\s+NUAGE USAGE LEDGER  ACCOUNT LIST']
description = """
- 勘定を勘定番号の順に 15 件ずつ出す (照会専用)
- 勘定の前に S を打って Enter で、勘定照会 (LBAL) へ進む
- 超過 (マイナス残高) の勘定は明るく出し、OVERDRAWN と付ける"""

[[screen.action]]
label = "次の 15 件 (PF8)"
keys = "{pf8}"

[[screen.action]]
label = "前の 15 件 (PF7)"
keys = "{pf7}"

[[screen.action]]
label = "HOST の勘定 (200-) から出す"
keys = "{home}{eraseeof}200-0000001{enter}"

[[screen.action]]
label = "終える (PF3)"
keys = "{pf3}"

[[screen.region]]
rows = [1, 1]
cols = [55, 79]
title = "照会基準日"
note = "照会用ファイルが、どの締め (最終締め日) の時点の元帳の写しか。元帳は夜間のバッチ (締め) だけが更新し、締めの後にジョブ LEDGINQ が照会用の写しを作る。照会用勘定マスタの管理レコード (キー 0000000000) から出す。"

[[screen.region]]
rows = [3, 3]
cols = [29, 39]
title = "開始する勘定番号 (入力)"
note = "ここに勘定番号を打って Enter を押すと、その番号から一覧を出す。1000000001 でも 100-0000001 でもよい。"

[[screen.region]]
rows = [6, 20]
cols = [3, 3]
title = "選択欄"
note = "S を打って Enter を押すと、その勘定の照会 (LBAL) へ進む。"

[[screen.region]]
rows = [6, 20]
cols = [5, 15]
title = "勘定番号"
note = "区分コード 3 桁 + 連番 7 桁。100- が K8S (名前空間)、200- が HOST (ホスト)。"

[[screen.region]]
rows = [6, 20]
cols = [51, 65]
title = "残高 (RU)"
note = "割当累計 - 使用累計。マイナスは割当の超過で、行を明るく表示する。"

[[screen.region]]
rows = [6, 20]
cols = [68, 68]
title = "状態"
note = "A = 勘定定義 (ACCTDEF) にある、U = 定義から消えた。"

[[screen.region]]
rows = [23, 23]
title = "メッセージ"
note = "PF8 FOR MORE ACCOUNTS は続きがあること、INQUIRY FILES NOT READY は照会用ファイルが無い (ジョブ LEDGINQ を流す) ことを表す。"

[[screen]]
id = "ledger-lbal"
title = "勘定照会 (KICKS のトランザクション LBAL)"
match = ['\A\s*LBAL\s+NUAGE USAGE LEDGER  ACCOUNT INQUIRY']
description = """
- 勘定の残高と、仕訳を新しい順に 10 件ずつ出す (照会専用)
- 仕訳の行の残高は、その仕訳を記帳した後の残高
- PF7 / PF8 で仕訳をめくり、PF5 で勘定一覧へ戻る"""

[[screen.action]]
label = "KUBE-SYSTEM (100-0000005) を照会"
keys = "{home}{eraseeof}100-0000005{enter}"

[[screen.action]]
label = "古い仕訳 (PF8)"
keys = "{pf8}"

[[screen.action]]
label = "新しい仕訳 (PF7)"
keys = "{pf7}"

[[screen.action]]
label = "勘定一覧へ (PF5)"
keys = "{pf5}"

[[screen.action]]
label = "終える (PF3)"
keys = "{pf3}"

[[screen.region]]
rows = [1, 1]
cols = [55, 79]
title = "照会基準日"
note = "照会用ファイルが、どの締め (最終締め日) の時点の元帳の写しか。照会用の仕訳は直近 35 回の締めの分 (仕訳の GDG の世代数) を持つ。"

[[screen.region]]
rows = [3, 3]
cols = [20, 30]
title = "勘定番号 (入力)"
note = "勘定番号を打って Enter を押す。1000000005 でも 100-0000005 でもよい。"

[[screen.region]]
rows = [6, 6]
cols = [17, 56]
title = "残高"
note = "割当累計 - 使用累計 (RU)。マイナスは割当の超過で、*** OVERDRAWN *** と出す。"

[[screen.region]]
rows = [7, 7]
cols = [17, 31]
title = "割当累計"
note = "開設時の割当と、毎週月曜の割当の合計 (RU)。"

[[screen.region]]
rows = [7, 7]
cols = [49, 63]
title = "使用累計"
note = "日々の使用量を RU に換算した合計。"

[[screen.region]]
rows = [8, 8]
cols = [65, 79]
title = "状態"
note = "A = 勘定定義 (ACCTDEF) にある、U = 定義から消えた。"

[[screen.region]]
rows = [12, 21]
cols = [15, 20]
title = "仕訳の連番"
note = "締め 1 回の中での仕訳の通し番号 (J-SEQ)。"

[[screen.region]]
rows = [12, 21]
cols = [22, 33]
title = "取引の種別"
note = "OPEN ALLOC = 開設時の割当、ALLOCATION = 週次の割当、USAGE = 使用。"

[[screen.region]]
rows = [12, 21]
cols = [36, 44]
title = "借方 / 貸方の科目"
note = "1100 割当原資 / 2100 利用者勘定 / 4100 使用実績。貸方が 2100 なら残高が増え、借方が 2100 なら減る。"

[[screen.region]]
rows = [12, 21]
cols = [47, 61]
title = "金額 (残高への影響)"
note = "仕訳の金額 (RU) に、この勘定の残高を増やすか (+) 減らすか (-) の符号を付けたもの。"

[[screen.region]]
rows = [12, 21]
cols = [65, 79]
title = "仕訳の後の残高"
note = "その仕訳を記帳した直後の残高。いちばん上の行は勘定マスタの残高と一致する。"

[[screen]]
id = "ledger-ended"
title = "照会の終了 (KICKS)"
match = ['\A(LLST|LBAL) ENDED\. TYPE LLST, LBAL OR KSSF']
description = """
- 使用量勘定の照会を終えた (KICKS はまだ動いている)
- CLEAR で画面を消し、LLST か LBAL を打つ
- KSSF を打つと KICKS を終えて TSO に戻る"""

[[screen.action]]
label = "画面を消す (CLEAR)"
keys = "{clear}"

[[screen]]
id = "ledger-tso-blank"
extends = "tso-blank"
description = "- 使用量勘定の KICKS の中なら LLST・LBAL・KSSF を打てる"

[[screen.action]]
label = "勘定一覧 (KICKS の中で LLST)"
keys = "LLST{enter}"

[[screen.action]]
label = "勘定照会 (KICKS の中で LBAL)"
keys = "LBAL{enter}"

[[screen.action]]
label = "KICKS を終えて TSO へ戻る (KSSF)"
keys = "KSSF{enter}"

# ---------------------------------------------------------------- データセット

[[term]]
pattern = '\bNUAGE\.USAGE\.MASTER(\.G\d{4}V\d{2})?'
title = "勘定マスタ"
note = "勘定ごとの残高・割当累計・使用累計 (補助元帳)。日次の締め (ジョブ LEDGER) のたびに新しい世代を作る。100 バイトのレコード 1 件が 1 勘定。"

[[term]]
pattern = '\bNUAGE\.USAGE\.JOURNAL(\.G\d{4}V\d{2})?'
title = "仕訳"
note = "締めで記帳した仕訳 (借方科目・貸方科目・金額)。締めごとに 1 世代。"

[[term]]
pattern = '\bNUAGE\.USAGE\.GL(\.G\d{4}V\d{2})?'
title = "総勘定元帳"
note = "科目 (1100 割当原資 / 2100 利用者勘定 / 4100 使用量) ごとの借方・貸方の累計。締めの試算表はここから作る。"

[[term]]
pattern = '\bNUAGE\.USAGE\.BIZDATE\b'
title = "業務日付"
note = "次に締める日と、最後に締めた日。締めが成功したときだけ進む。"

[[term]]
pattern = '\bNUAGE\.USAGE\.CNTL\b'
title = "管理表 (PDS)"
note = "料率表 RATES と勘定定義 ACCTDEF をメンバーに持つ。Git (nuage-usage-ledger) から反映される。"

[[term]]
pattern = '\bNUAGE\.USAGE\.JCLLIB\b'
title = "ジョブのライブラリ (PDS)"
note = "ジョブ USAGERPT (日次使用量明細) と LEDGER (日次の締め) の JCL。毎朝 ZTIMER が投入する。"

[[term]]
pattern = '\bNUAGE\.USAGE\.GDGMODEL\b'
title = "GDG のモデル"
note = "GDG の世代を作るときに属性を写す元 (MVS 3.8j では必要)。データは持たない。"

[[term]]
pattern = '\bNUAGE\.USAGE\.INQMAST(\.DATA|\.INDEX)?\b'
title = "照会用の勘定マスタ (VSAM KSDS)"
note = "オンライン (KICKS) が勘定番号で引く、勘定マスタの写し。締めの後にジョブ LEDGINQ が作り直す。先頭のキー 0000000000 は管理レコード (照会基準日)。"

[[term]]
pattern = '\bNUAGE\.USAGE\.INQJRNL(\.DATA|\.INDEX)?\b'
title = "照会用の仕訳 (VSAM KSDS)"
note = "オンライン (KICKS) が勘定ごとに新しい順に読む、仕訳の写し (直近 35 回の締めの分)。キーは勘定番号 + 反転した日付 + 反転した連番。ジョブ LEDGINQ が作り直す。"

[[term]]
pattern = '\bNUAGE\.USAGE\.CLIST\b'
title = "CLIST のライブラリ (PDS)"
note = "メンバー LEDGER がオンライン照会を始める CLIST (EXEC 'NUAGE.USAGE.CLIST(LEDGER)')。"

[[term]]
pattern = '\bNUAGE\.USAGE\.KICKS\.V1R5M0\.(SKIKLOAD|KIKRPL|COBCOPY|GCCCOPY)\b'
title = "オンライン (KICKS) のライブラリ"
note = "KICKS の利用者ライブラリの形 (TSOID.KICKS.V1R5M0.*)。SKIKLOAD は表 (SIT/PCT/PPT/FCT、接尾辞 LG)、KIKRPL はプログラムと物理マップ、COBCOPY は記号マップ。ジョブ LEDGBLD が作る。"

[[term]]
pattern = '\bLEDGINQ\b'
title = "ジョブ LEDGINQ (照会用ファイルの作成)"
note = "締め (LEDGER) が成功すると内部リーダで投入される。勘定マスタと仕訳を照会用の VSAM に写す。KICKS で照会中だと失敗するので、サインオフ (KSSF) してから流し直す。"

[[term]]
pattern = '\bLEDGBLD\b'
title = "ジョブ LEDGBLD (オンラインのビルド)"
note = "KICKS の表・マップ・プログラムをアセンブル・コンパイル・リンクする。資材が変わると nuage-cluster の mvs-config が流す。"

# ---------------------------------------------------------------- レコード定義
# ブラウズ画面でマウス位置の桁が何の項目かを出し、16 進表示なら値を読む。
# 定義の出典は mvs/POSTING.cbl (COBOL のレコード定義)。レコードを変えたら合わせて変える。
# dataset は世代 (.G0001V00) とメンバー名 ((RATES)) を除いた名前に当てる。
# kind: char (文字) / zoned (数字の文字) / packed (パック 10 進数 COMP-3)

[[layout]]
dataset = 'NUAGE\.USAGE\.MASTER'
title = "勘定マスタのレコード (100 バイト)"

[[layout.field]]
cols = [1, 10]
name = "勘定番号 (NM-ACCT)"
note = "100- が K8S (名前空間)、200- が HOST (ホスト)。"

[[layout.field]]
cols = [11, 15]
name = "区分 (NM-CLASS)"

[[layout.field]]
cols = [16, 39]
name = "名称 (NM-NAME)"

[[layout.field]]
cols = [40, 45]
name = "残高 (NM-BAL)"
kind = "packed"
note = "PIC S9(11) COMP-3。単位は RU。割当累計 - 使用累計。"

[[layout.field]]
cols = [46, 51]
name = "割当累計 (NM-ALLOC)"
kind = "packed"
note = "PIC S9(11) COMP-3。開設時の割当と、毎週月曜の割当の合計。"

[[layout.field]]
cols = [52, 57]
name = "使用累計 (NM-USED)"
kind = "packed"
note = "PIC S9(11) COMP-3。日々の使用量を RU に換算した合計。"

[[layout.field]]
cols = [58, 65]
name = "開設日 (NM-OPENED)"

[[layout.field]]
cols = [66, 73]
name = "最終取引日 (NM-LAST)"

[[layout.field]]
cols = [74, 74]
name = "状態 (NM-STATUS)"
note = "A = 勘定定義 (ACCTDEF) にある、U = 定義から消えた。"

[[layout.field]]
cols = [75, 100]
name = "予備 (FILLER)"

[[layout]]
dataset = 'NUAGE\.USAGE\.JOURNAL'
title = "仕訳のレコード (80 バイト)"

[[layout.field]]
cols = [1, 8]
name = "日付 (J-DATE)"

[[layout.field]]
cols = [9, 14]
name = "連番 (J-SEQ)"
kind = "zoned"

[[layout.field]]
cols = [15, 18]
name = "借方科目 (J-DEBIT)"
note = "1100 割当原資 / 2100 利用者勘定 / 4100 使用量。"

[[layout.field]]
cols = [19, 22]
name = "貸方科目 (J-CREDIT)"

[[layout.field]]
cols = [23, 32]
name = "勘定番号 (J-ACCT)"

[[layout.field]]
cols = [33, 33]
name = "種別 (J-TYPE)"
note = "O = 開設時の割当、A = 週次の割当、U = 使用。"

[[layout.field]]
cols = [34, 44]
name = "金額 (J-AMOUNT)"
kind = "zoned"
note = "PIC 9(11)。単位は RU。"

[[layout.field]]
cols = [45, 80]
name = "予備 (FILLER)"

[[layout]]
dataset = 'NUAGE\.USAGE\.GL'
title = "総勘定元帳のレコード (80 バイト)"

[[layout.field]]
cols = [1, 4]
name = "科目コード (NG-CODE)"

[[layout.field]]
cols = [5, 20]
name = "科目名 (NG-NAME)"

[[layout.field]]
cols = [21, 26]
name = "借方累計 (NG-DEBIT)"
kind = "packed"
note = "PIC S9(11) COMP-3。"

[[layout.field]]
cols = [27, 32]
name = "貸方累計 (NG-CREDIT)"
kind = "packed"
note = "PIC S9(11) COMP-3。"

[[layout.field]]
cols = [33, 80]
name = "予備 (FILLER)"

[[layout]]
dataset = 'NUAGE\.USAGE\.BIZDATE'
title = "業務日付のレコード (80 バイト)"

[[layout.field]]
cols = [1, 8]
name = "次に締める日 (B-NEXT)"

[[layout.field]]
cols = [10, 17]
name = "最後に締めた日 (B-LAST)"

[[layout]]
dataset = 'NUAGE\.USAGE\.INQMAST(\.DATA)?'
title = "照会用の勘定マスタのレコード (100 バイト、キー 1-10)"

[[layout.field]]
